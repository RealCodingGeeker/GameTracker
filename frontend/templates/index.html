{% extends "base.html" %}
{% block content %}
<a class="btn" href="{{ url_for('add') }}">+ Add Game</a>

<table>
    <tr>
        <th>Title</th><th>Platform</th><th>Hours</th><th>Completed</th><th>Actions</th>
    </tr>
    {% for game in games %}
    <tr>
        <td><a href="{{ url_for('detail', game_id=game.id) }}">{{ game.title }}</a></td>
        <td>{{ game.platform }}</td>
        <td>{{ game.hours_played }}</td>
        <td>{{ "Yes" if game.completed else "No" }}</td>
        <td>
            <a href="{{ url_for('edit', game_id=game.id) }}">Edit</a>
            <form class="inline" method="post" action="{{ url_for('delete', game_id=game.id) }}"
                  onsubmit="return confirm('Delete this game?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% else %}
    <tr><td colspan="5">No games yet. Add one!</td></tr>
    {% endfor %}
</table>
{% endblock %}
