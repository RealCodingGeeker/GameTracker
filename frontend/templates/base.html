<!DOCTYPE html>
<html>
<head>
    <title>Game Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .flash { background: #e8f5e9; border: 1px solid #81c784; padding: 10px; margin: 10px 0; }
        label { display: block; margin-top: 12px; }
        input[type=text], input[type=number] { width: 100%; padding: 6px; }
        button, .btn { padding: 6px 12px; margin-top: 12px; cursor: pointer; }
        form.inline { display: inline; }
    </style>
</head>
<body>
    <h1><a href="{{ url_for('index') }}" style="text-decoration:none;color:inherit;">Game Tracker</a></h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
