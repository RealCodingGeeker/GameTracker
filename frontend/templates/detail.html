{% extends "base.html" %}
{% block content %}
<h2>{{ game.title }}</h2>
<p><strong>Platform:</strong> {{ game.platform }}</p>
<p><strong>Hours played:</strong> {{ game.hours_played }}</p>
<p><strong>Completed:</strong> {{ "Yes" if game.completed else "No" }}</p>
<p><strong>ID:</strong> {{ game.id }}</p>

<a class="btn" href="{{ url_for('edit', game_id=game.id) }}">Edit</a>
<a class="btn" href="{{ url_for('index') }}">Back to list</a>
{% endblock %}
